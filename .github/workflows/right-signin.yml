name: right-signin

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"

env:
  RELEASE_BRANCH: release
  BINARY_NAME: right-signin_linux_amd64

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      COOKIES: ${{ secrets.COOKIES }}
      FEISHU_BOT_URL: ${{ secrets.FEISHU_BOT_URL }}
      GITHUB_TOKEN: ${{ secrets.RIGHT_SIGNIN_GITHUB_TOKEN }}
      RIGHT_SIGNIN_GITHUB_REPO: ${{ github.repository }}
      RIGHT_SIGNIN_GITHUB_SECRET_NAME: COOKIES
      RIGHT_SIGNIN_NOTIFY_SUCCESS: "true"
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run right-signin binary
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            chmod -R 777 "${BINARY_NAME}"
            ./${BINARY_NAME}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 8

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() && github.event_name != 'push' }}
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
