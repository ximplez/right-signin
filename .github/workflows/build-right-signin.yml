name: Build-right-signin

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "*.md"
      - ".github/workflows/**"
      - ".gitignore"
      - ".git/**"
      - "LICENSE"
      - "runtime/**"
    branches:
      - main

env:
  RELEASE_BRANCH: release
  BINARY_NAME: right-signin_linux_amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          path: build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: build/go.mod

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          path: release

      - name: Build right-signin binary
        run: |
          cd build || exit 1
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "dist/${BINARY_NAME}" ./cmd/right-signin

      - name: Copy binary to release branch
        run: |
          cp "build/dist/${BINARY_NAME}" "release/${BINARY_NAME}"

      - name: Commit release branch artifacts
        run: |
          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan latest_branch
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "build right-signin"
          git branch -D "${RELEASE_BRANCH}" || true
          git branch -m "${RELEASE_BRANCH}"
          git push -f origin "${RELEASE_BRANCH}"

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 8
